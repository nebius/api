syntax = "proto3";

package nebius.mk8s.v1;

import "buf/validate/validate.proto";
import "nebius/annotations.proto";
import "nebius/common/v1/metadata.proto";
import "nebius/common/v1/resource_event.proto";

option go_package = "github.com/nebius/gosdk/proto/nebius/mk8s/v1";
option java_multiple_files = true;
option java_outer_classname = "ClusterProto";
option java_package = "ai.nebius.pub.mk8s.v1";

message Cluster {
  common.v1.ResourceMetadata metadata = 1 [
    (buf.validate.field) = {
      cel: [
        {
          id: "metadata_name"
          message: "'name' must be 1 to 63 characters long and use only letters, digits, '-', or '_', starting and ending with a letter or digit"
          expression: "size(this.name) >= 1 && size(this.name) <= 63 && this.name.matches('^(([A-Za-z0-9][-A-Za-z0-9_]*)?[A-Za-z0-9])?$')"
        },
        {
          id: "metadata_parent_id"
          message: "'parent_id' must be no more than 63 characters long"
          expression: "size(this.parent_id) <= 63"
        }
      ]
    },
    (nid) = {
      parent_resource: ["project"]
    }
  ];

  ClusterSpec spec = 2;

  ClusterStatus status = 3;
}

message ClusterSpec {
  ControlPlaneSpec control_plane = 2 [(buf.validate.field).required = true];

  // Defines kubernetes network configuration, like IP allocation.
  KubeNetworkSpec kube_network = 3;
}

message ControlPlaneSpec {
  // Desired Kubernetes version of the cluster. May be lower than the actual cluster version
  // if the desired version is no longer supported and the cluster has been automatically updated.
  // For now only acceptable format is `<major>.<minor>` like "1.31".
  // Option for patch version update will be added later.
  string version = 1 [(buf.validate.field) = {
    string: {pattern: "|^\\d\\.\\d\\d$"}
  }];

  // Nebius VPC Subnet ID where control plane instances will be located.
  // If it isn't specified default network of the parent container will be used.
  // Also will be default NodeGroup subnet.
  string subnet_id = 2 [
    (field_behavior) = NON_EMPTY_DEFAULT,
    (field_behavior) = IMMUTABLE,
    (nid) = {
      resource: ["vpcsubnet"]
    }
  ];

  // Specification of endpoints of cluster control plane.
  ControlPlaneEndpointsSpec endpoints = 3;

  // Number of instances in etcd cluster.
  // 3 by default.
  // Control plane with `etcd_cluster_size: 3` called "Highly Available" ("HA"), because it's Kubernetes API
  // will be available despite a failure of one control plane instance.
  int64 etcd_cluster_size = 4 [(buf.validate.field) = {
    int64: {
      in: [
        0,
        1,
        3
      ]
    }
  }];

  // Specify configuration of the pushing k8s audit logs into service logs and show it in the UI.
  // By default cluster will be created without it.
  AuditLogsSpec audit_logs = 5 [(field_behavior) = MEANINGFUL_EMPTY_VALUE];

  // Enables installation of the Karpenter inside a cluster.
  // Karpenter will be installed as a helm chart inside cluster
  // so it requires creation of at least one CPU public node group.
  //
  // Please note that there is no feature parity between Karpenter node pools and
  // public node groups.
  // By default cluster will be created without it.
  Karpenter karpenter = 6 [(field_behavior) = MEANINGFUL_EMPTY_VALUE];

  // Configures customer JWT authentication. Requires Kubernetes 1.34 and a compatible control-plane infra version.
  AuthenticationSpec authentication = 7;
}

message AuthenticationSpec {
  // Configures OIDC providers for Kubernetes user authentication.
  repeated OIDCProvider oidc = 1 [(buf.validate.field) = {
    repeated: {max_items: 64}
  }];
}

message OIDCProvider {
  // Identifies this provider within the cluster configuration.
  string name = 1 [(buf.validate.field) = {
    string: {min_len: 1}
  }];

  // Defines the issuer for accepted tokens.
  OIDCIssuer issuer = 2 [(buf.validate.field).required = true];

  // Maps token claims to Kubernetes user attributes.
  ClaimMappings claim_mappings = 3 [(buf.validate.field).required = true];

  // Validates token claims before Kubernetes authenticates the user.
  repeated ClaimValidationRule claim_validation_rules = 4;

  // Validates the mapped Kubernetes user information.
  repeated CELValidationRule user_validation_rules = 5;
}

message OIDCIssuer {
  // Identifies the issuer and must match the token `iss` claim.
  string url = 1 [(buf.validate.field) = {
    string: {min_len: 1}
  }];

  // Lists the token audiences that this issuer accepts, for example, `["kubernetes", "dashboard"]`.
  repeated string audiences = 2 [(buf.validate.field) = {
    repeated: {
      min_items: 1
      unique: true
      items: {
        string: {min_len: 1}
      }
    }
  }];

  // Overrides the OpenID discovery URL. An empty value uses the issuer's standard discovery URL.
  string discovery_url = 3;

  // PEM CA bundle for discovery and JWKS. Omission uses system trust.
  string certificate_authority = 4;
}

message ClaimMappings {
  // Maps token claims to the Kubernetes username.
  PrefixedClaimMapping username = 1 [(buf.validate.field).required = true];

  // Maps token claims to Kubernetes groups. Omission disables group mapping.
  PrefixedClaimMapping groups = 2;
}

message PrefixedClaimMapping {
  option (buf.validate.message) = {
    cel: [
      {
        id: "claim_expression_exclusive"
        message: "Configure either a claim or an expression"
        expression: "(this.claim != '') != (this.expression != '')"
      },
      {
        id: "expression_prefix_exclusive"
        message: "An expression cannot use a prefix"
        expression: "this.expression == '' || !has(this.prefix)"
      }
    ]
  };

  // Names the token claim to map.
  string claim = 1;

  // Omission and an empty value disable prefixing for claims. Expressions require omission, including for an empty value.
  optional string prefix = 2;

  // Maps token claims with a CEL expression.
  string expression = 3;
}

message ClaimValidationRule {
  option (buf.validate.message) = {
    cel: [
      {
        id: "claim_validation_rule"
        message: "Configure either an exact claim match or a CEL expression"
        expression: "(this.claim != '') != (this.expression != '')"
      },
      {
        id: "claim_validation_fields"
        message: "Exact matches cannot use messages; expressions cannot use required_value"
        expression: "(this.claim == '' || this.message == '') && (this.expression == '' || this.required_value == '')"
      }
    ]
  };

  // Names the token claim that must match required_value exactly.
  string claim = 1;

  // An omitted value matches an empty string, following upstream behavior.
  string required_value = 2;

  // Validates token claims with CEL. The expression must evaluate to true.
  string expression = 3;

  // Describes a failed CEL validation.
  string message = 4;
}

message CELValidationRule {
  // Validates the mapped Kubernetes user information with CEL.
  string expression = 1 [(buf.validate.field) = {
    string: {min_len: 1}
  }];

  // Describes a failed CEL validation.
  string message = 2;
}

message ControlPlaneEndpointsSpec {
  // Public endpoint specification. When set, a public endpoint is created.
  PublicEndpointSpec public_endpoint = 1 [(field_behavior) = MEANINGFUL_EMPTY_VALUE];
}

message PublicEndpointSpec {
  // List of CIDR blocks from which access to public endpoint is allowed.
  // If field is not set, or list is empty, it means that access is not restricted at all.
  // You can specify a maximum of 100 CIDRs.
  repeated string allowed_cidrs = 2 [(buf.validate.field) = {
    repeated: {
      max_items: 100
      items: {
        cel: [
          {
            id: "string.valid_ipv4_cidr"
            message: "Value must be a valid IPv4 CIDR, the prefix must have all zeros for the masked bits of the prefix (e.g. `127.0.0.0/16`, not `127.0.0.1/16`)."
            expression: "this.isIpPrefix(4, true)"
          }
        ]
      }
    }
  }];
}

message KubeNetworkSpec {
  // CIDR blocks for Service ClusterIP allocation.
  // For now, only one value is supported.
  // Must be a valid CIDR block or prefix length.
  // In case of prefix length, certain CIDR is auto allocated.
  // Specified CIDR blocks will be reserved in Cluster.spec.control_plane.subnet_id to prevent address duplication.
  // Allowed prefix length is from "/12" to "/28".
  // Empty value treated as ["/16"].
  repeated string service_cidrs = 1 [
    (buf.validate.field) = {
      repeated: {max_items: 1}
      cel: [
        {
          id: "string.valid_cidr"
          message: "value must be a CIDR block or prefix length from \"/12\" to \"/28\""
          expression: "this.all(x, x.matches('^(.*)/(1[2-9]|2[0-8])$'))"
        }
      ]
    },
    (field_behavior) = IMMUTABLE
  ];
}

message AuditLogsSpec {}

message Karpenter {}

message ClusterStatus {
  enum State {
    STATE_UNSPECIFIED = 0;

    PROVISIONING = 1;

    RUNNING = 2;

    DELETING = 3;
  }

  State state = 1;

  ControlPlaneStatus control_plane = 2;

  repeated common.v1.RecurrentResourceEvent events = 3;

  // Show that changes are in flight
  bool reconciling = 100;
}

message ControlPlaneStatus {
  // Actual Kubernetes and configuration version.
  // Version has format `<major>.<minor>.<patch>-nebius-cp.<infra_version>` like
  // "1.30.0-nebius-cp.3", where `<major>.<minor>.<patch>` is Kubernetes version and `<infra_version>` is version of control plane
  // infrastructure and configuration, updating of which may include bug fixes, security updates and new features of components running on
  // control plane, like CCM or Cluster Autoscaler.
  string version = 1;

  ControlPlaneStatusEndpoints endpoints = 2;

  // Number of instances in etcd cluster.
  int64 etcd_cluster_size = 3;

  ControlPlaneStatusAuth auth = 100;
}

// Endpoints of Kubernetes control plane. Kubernetes API can be accessed at `https://endpoint/`.
message ControlPlaneStatusEndpoints {
  // DNS name or IP address accessible from the Internet.
  string public_endpoint = 1;

  // DNS name or IP address accessible from the user VPC.
  string private_endpoint = 2;
}

message ControlPlaneStatusAuth {
  // PEM with the Cluster Certificate Authority, that must be used for TLS connection to Kubernetes API.
  string cluster_ca_certificate = 1;
}
