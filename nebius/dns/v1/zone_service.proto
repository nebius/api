syntax = "proto3";

package nebius.dns.v1;

import "buf/validate/validate.proto";
import "nebius/annotations.proto";
import "nebius/common/v1/metadata.proto";
import "nebius/common/v1/operation.proto";
import "nebius/dns/v1/zone.proto";

option go_package = "github.com/nebius/gosdk/proto/nebius/dns/v1";
option java_multiple_files = true;
option java_outer_classname = "ZoneServiceProto";
option java_package = "ai.nebius.pub.dns.v1";

// Service for managing DNS zones (`Zone` resources)
service ZoneService {
  option (api_service_name) = "dns";

  // Gets the DNS zone with the specified ID
  rpc Get(GetZoneRequest) returns (Zone);

  // Gets the DNS zone by its parent IAM container (`metadata.parent_id`) and `metadata.name`
  rpc GetByName(common.v1.GetByNameRequest) returns (Zone);

  // Lists DNS zones in the specified parent IAM container
  rpc List(ListZonesRequest) returns (ListZonesResponse);

  // Lists DNS zones in the specified virtual network
  rpc ListByNetwork(ListZonesByNetworkRequest) returns (ListZonesResponse) {
    option (method_behavior) = METHOD_PAGINATED;
  }

  // Creates a DNS zone
  rpc Create(CreateZoneRequest) returns (common.v1.Operation);

  // Updates the DNS zone with the specified ID
  rpc Update(UpdateZoneRequest) returns (common.v1.Operation);

  // Deletes the DNS zone with the specified ID
  rpc Delete(DeleteZoneRequest) returns (common.v1.Operation);
}

// Request to list DNS zones in the specified virtual network
message ListZonesByNetworkRequest {
  // Network ID
  string network_id = 1 [
    (buf.validate.field).required = true,
    (nid) = {
      resource: ["vpcnetwork"]
    }
  ];

  // Page size
  // If not specified or set to `0`, a default page size of `100` will be used
  int64 page_size = 2;

  // An opaque listing continuation token
  // - If not specified or empty, the first page of results will be returned
  // - If specified, the next page of results (as identified by the token) will be returned
  string page_token = 3;
}
