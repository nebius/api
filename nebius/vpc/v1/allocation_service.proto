syntax = "proto3";

package nebius.vpc.v1;

import "buf/validate/validate.proto";
import "nebius/annotations.proto";
import "nebius/common/v1/metadata.proto";
import "nebius/common/v1/operation.proto";
import "nebius/vpc/v1/allocation.proto";

option go_package = "github.com/nebius/gosdk/proto/nebius/vpc/v1";
option java_multiple_files = true;
option java_outer_classname = "AllocationServiceProto";
option java_package = "ai.nebius.pub.vpc.v1";

// AllocationService provides operations for managing allocations.
service AllocationService {
  option (api_service_name) = "vpc";

  // Retrieves an allocation by its ID.
  rpc Get(GetAllocationRequest) returns (Allocation);

  // Retrieves an allocation by its name within a specified parent.
  rpc GetByName(GetAllocationByNameRequest) returns (Allocation);

  // Lists allocations within a specified parent.
  rpc List(ListAllocationsRequest) returns (ListAllocationsResponse);

  // Lists allocations from a specified pool.
  rpc ListByPool(ListAllocationsByPoolRequest) returns (ListAllocationsResponse);

  // Lists allocations available to a specified subnet, including unassigned allocations from compatible pools.
  rpc ListBySubnet(ListAllocationsBySubnetRequest) returns (ListAllocationsResponse);

  // Creates a new allocation with the specified configuration.
  rpc Create(CreateAllocationRequest) returns (common.v1.Operation);

  // Updates an existing allocation with new configuration parameters.
  rpc Update(UpdateAllocationRequest) returns (common.v1.Operation);

  // Deletes an allocation by its ID.
  rpc Delete(DeleteAllocationRequest) returns (common.v1.Operation);
}

message GetAllocationRequest {
  // ID of the allocation.
  string id = 1 [
    (buf.validate.field).required = true,
    (nid) = {
      resource: ["vpcallocation"]
    }
  ];
}

message GetAllocationByNameRequest {
  // ID of the parent project.
  string parent_id = 1 [
    (buf.validate.field).required = true,
    (nid) = {
      resource: ["project"]
    }
  ];

  // Name of the allocation.
  string name = 2 [(buf.validate.field).required = true];
}

message ListAllocationsRequest {
  // ID of the parent project.
  string parent_id = 1 [
    (buf.validate.field).required = true,
    (nid) = {
      resource: ["project"]
    }
  ];

  // Maximum number of allocations to return.
  int64 page_size = 2;

  // Token to retrieve the next page of allocations.
  string page_token = 3;
}

message ListAllocationsByPoolRequest {
  // ID of the source pool.
  string pool_id = 1 [
    (buf.validate.field).required = true,
    (nid) = {
      resource: ["vpcpool"]
    }
  ];

  // Maximum number of allocations to return.
  int64 page_size = 2;

  // Token to retrieve the next page of allocations.
  string page_token = 3;
}

message ListAllocationsBySubnetRequest {
  // ID of the subnet.
  string subnet_id = 1 [
    (buf.validate.field).required = true,
    (nid) = {
      resource: ["vpcsubnet"]
    }
  ];

  // Maximum number of allocations to return.
  int64 page_size = 2;

  // Token to retrieve the next page of allocations.
  string page_token = 3;
}

message ListAllocationsResponse {
  repeated Allocation items = 1;

  string next_page_token = 2;
}

message CreateAllocationRequest {
  // Metadata of the allocation.
  common.v1.ResourceMetadata metadata = 1 [
    (buf.validate.field) = {
      cel: [
        {
          id: "metadata_name"
          message: "'name' must start with a letter or digit, allow '-', '_', '.', '/', and have a length between 2 and 255 characters."
          expression: "this.name.matches('^[a-zA-Z0-9][-_./a-zA-Z0-9]{1,254}$')"
        }
      ]
      required: true
    },
    (nid) = {
      parent_resource: ["project"]
    }
  ];

  // Specification of the allocation.
  AllocationSpec spec = 2 [(buf.validate.field).required = true];
}

message UpdateAllocationRequest {
  // Updated metadata of the allocation.
  common.v1.ResourceMetadata metadata = 1 [
    (nid) = {
      parent_resource: ["project"]
    },
    (buf.validate.field) = {
      cel: [
        {
          id: "metadata_name"
          message: "'name' must start with a letter or digit, allow '-', '_', '.', '/', and have a length between 2 and 255 characters."
          expression: "this.name.matches('^[a-zA-Z0-9][-_./a-zA-Z0-9]{1,254}$')"
        }
      ]
    }
  ];

  // Updated specification of the allocation.
  AllocationSpec spec = 2;
}

message DeleteAllocationRequest {
  // ID of the allocation.
  string id = 1 [
    (buf.validate.field).required = true,
    (nid) = {
      resource: ["vpcallocation"]
    }
  ];
}
